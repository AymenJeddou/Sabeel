# Local stack: PostGIS + Core API + RAG service. The API applies the database
# migrations itself on startup (backend/app/migrate.py).
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadscan
    ports:
      # Host-side 5433 avoids clashing with a native Postgres install already on 5432.
      - "5433:5432"
    volumes:
      - roadscan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/roadscan
      RAG_SERVICE_URL: http://rag-service:8001
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rag-service:
        condition: service_started

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    env_file:
      - ./rag-service/.env
    volumes:
      - roadscan_chroma_data:/app/chroma_db
    ports:
      - "8001:8001"

volumes:
  roadscan_db_data:
  roadscan_chroma_data:
