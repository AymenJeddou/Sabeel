# Local dev only. Draft for WP-T review — not the Cloud Run deploy setup.
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadscan
    ports:
      # Host-side 5433 avoids clashing with a native Postgres install already on 5432.
      - "5433:5432"
    volumes:
      - roadscan_db_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/roadscan
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  roadscan_db_data:
