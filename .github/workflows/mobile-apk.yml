name: Mobile APK

# Builds the Android APK. On a published GitHub release, the APK is attached
# to it (the public page's "Application Android" button links to releases).
# Set the repository variable API_BASE_URL to the deployed Core API.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../sabeel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sabeel-apk
          path: sabeel.apk
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../sabeel.apk --clobber
