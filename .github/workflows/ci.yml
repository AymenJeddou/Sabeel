name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadscan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The tests create and migrate their own `sabeel_test` database on this server.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/roadscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/app/requirements.txt
      - run: pip install -r backend/app/requirements.txt
      - run: python -m pytest backend/app/tests -q
      - name: Migrations apply cleanly to an empty database
        run: python -m backend.app.migrate

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install onnxruntime "opencv-python-headless<5" numpy
      - run: python severity_scoring.py
        working-directory: ml-training
      - name: Model loads and finds a pothole in a seed photo
        working-directory: ml-training
        run: python inference.py ../backend/app/static/photos/_seed/p08.jpg

  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-service/requirements.txt
      # CPU-only torch: the default wheel pulls ~2GB of CUDA libs the tests never use.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5 # pinned: newer stables deprecate material.dart, a migration of its own
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
