doc_title: "MVP engineering placeholder -- pistes non classées"
is_placeholder: true

rules:
  - rule_id: PH-PISTE-001
    road_type: piste
    section: "Traitement par défaut"
    lang: fr
    severity_min: 3
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Une piste non classée n'a pas de service d'entretien dédié ; un
      signalement de sévérité 3 ou plus est transmis à la DGPC pour
      évaluation d'une éventuelle intégration au réseau routier classé,
      plutôt qu'une réparation immédiate garantie.

  - rule_id: PH-PISTE-002
    road_type: piste
    section: "Priorité basse"
    lang: fr
    severity_min: 1
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Les signalements de sévérité 1-2 sur piste non classée sont
      archivés sans action immédiate, faute de budget d'entretien dédié
      à ce type de voie.

  - rule_id: PH-PISTE-003
    road_type: piste
    section: "Sécurité minimale"
    lang: fr
    severity_min: 5
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Même sur une piste non classée, un danger de sévérité 5 (risque
      d'accident grave) doit faire l'objet d'un balisage de sécurité
      minimal signalé à la direction régionale la plus proche.
