doc_title: "MVP engineering placeholder -- autoroutes"
is_placeholder: true

rules:
  - rule_id: PH-AUTO-001
    road_type: autoroute
    section: "Seuil d'urgence -- toute sévérité >= 3"
    lang: fr
    severity_min: 3
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Sur autoroute, en raison des vitesses élevées, tout nid de poule de
      sévérité 3 ou plus est traité comme urgent : signalisation immédiate
      et intervention de la DGPC sous 24h.

  - rule_id: PH-AUTO-002
    road_type: autoroute
    section: "Fermeture de voie"
    lang: fr
    severity_min: 4
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Pour une sévérité 4 ou 5 sur autoroute, une fermeture partielle de
      voie avec balisage réglementaire est requise le temps de la
      réparation, en coordination avec l'exploitant autoroutier.

  - rule_id: PH-AUTO-003
    road_type: autoroute
    section: "Matériaux"
    lang: fr
    severity_min: 3
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Sur autoroute, seul un enrobé à chaud à prise rapide est utilisé pour
      la réparation, même en intervention d'urgence, en raison des
      contraintes de charge et de vitesse.
