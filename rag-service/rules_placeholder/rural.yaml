doc_title: "MVP engineering placeholder -- routes régionales/locales (rural)"
is_placeholder: true

rules:
  - rule_id: PH-RURAL-001
    road_type: rural
    section: "Seuil d'urgence -- sévérité 5"
    lang: fr
    severity_min: 5
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Sur une route régionale ou locale classée, un nid de poule de sévérité
      5 justifie une intervention de la direction régionale de la DGPC sous
      5 jours ouvrés, avec signalisation immédiate si le trafic est rapide.

  - rule_id: PH-RURAL-002
    road_type: rural
    section: "Méthode de réparation -- sévérité 3-4"
    lang: fr
    severity_min: 3
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Pour un nid de poule de sévérité 3 ou 4 sur route régionale/locale,
      un enrobé à froid est acceptable en intervention rapide ; un
      reprofilage complet est recommandé lors de la prochaine campagne
      d'entretien périodique de la direction régionale.

  - rule_id: PH-RURAL-003
    road_type: rural
    section: "Trafic agricole"
    lang: fr
    severity_min: 2
    target_office: DGPC
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Les routes locales à vocation agricole avec trafic lent (tracteurs,
      engins) tolèrent un délai d'intervention plus long pour les
      sévérités 1-2, sauf signalement répété au même point.
