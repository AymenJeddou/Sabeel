doc_title: "MVP engineering placeholder -- routes urbaines principales"
is_placeholder: true

rules:
  - rule_id: PH-URB-PRIN-001
    road_type: urbain_principal
    section: "Seuil d'urgence -- sévérité 5"
    lang: fr
    severity_min: 5
    target_office: Municipality
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Sur un axe urbain principal à fort trafic, un nid de poule de sévérité 5
      (profond, danger réel) doit être traité en urgence sous 48h -- barriérage
      provisoire immédiat si un déplacement du service technique n'est pas
      possible le jour même.

  - rule_id: PH-URB-PRIN-002
    road_type: urbain_principal
    section: "Méthode de réparation -- sévérité 3-4"
    lang: fr
    severity_min: 3
    target_office: Municipality
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Pour un nid de poule de sévérité 3 ou 4 sur chaussée urbaine principale,
      un colmatage à froid (enrobé à froid compacté) est acceptable en
      intervention rapide ; une reprise à l'enrobé à chaud est recommandée
      dans un délai de 2 à 4 semaines pour une réparation durable.

  - rule_id: PH-URB-PRIN-003
    road_type: urbain_principal
    section: "Signalisation temporaire"
    lang: fr
    severity_min: 4
    target_office: Municipality
    source: "MVP engineering placeholder (not a real statute)"
    text: >
      Tant qu'un nid de poule de sévérité 4 ou 5 n'est pas réparé sur un axe
      principal, une signalisation temporaire (cône, ruban) doit être posée
      pour prévenir les usagers, en particulier de nuit.
